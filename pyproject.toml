[project]
name = "emotional-numbers-mk-ii"
version = "0.1.0"
description = "Severance MDR Terminal - Emotional Numbers Game"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mdr-terminal = "emotional_numbers_mk_ii.adapters.web.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotional_numbers_mk_ii"]
