<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUMON MDR TERMINAL</title>
    <link rel="stylesheet" href="/static/terminal.css?v=7">
</head>
<body>
    <div class="crt-container">
        <div class="terminal">
            <!-- Header Bar - Severance Style -->
            <div class="header-bar">
                <span class="file-name" id="file-name">Pacoima</span>
                <span class="progress-display">
                    <span id="progress-percent">0</span>% Complete
                    <span class="lumon-icon"></span>
                </span>
                <span class="lumon-brand">LUMON</span>
            </div>

            <!-- Number Grid - Full Width -->
            <div class="grid-area">
                <div class="grid" id="grid"></div>
            </div>

            <!-- Bins with Individual Progress Bars -->
            <div class="bins-container">
                <div class="bin" data-bin="01">
                    <div class="bin-label">01</div>
                    <div class="bin-progress">
                        <div class="bin-progress-fill" id="bin-01-fill"></div>
                    </div>
                </div>
                <div class="bin" data-bin="02">
                    <div class="bin-label">02</div>
                    <div class="bin-progress">
                        <div class="bin-progress-fill" id="bin-02-fill"></div>
                    </div>
                </div>
                <div class="bin" data-bin="03">
                    <div class="bin-label">03</div>
                    <div class="bin-progress">
                        <div class="bin-progress-fill" id="bin-03-fill"></div>
                    </div>
                </div>
                <div class="bin" data-bin="04">
                    <div class="bin-label">04</div>
                    <div class="bin-progress">
                        <div class="bin-progress-fill" id="bin-04-fill"></div>
                    </div>
                </div>
                <div class="bin" data-bin="05">
                    <div class="bin-label">05</div>
                    <div class="bin-progress">
                        <div class="bin-progress-fill" id="bin-05-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Hex Codes Footer - Pointer Coordinates -->
            <div class="hex-footer">
                <span class="hex-coords"><span id="hex-x">0x00000000</span>:<span id="hex-y">0x00000000</span></span>
            </div>

            <!-- Message Area (for hints/feedback) -->
            <div id="message-area"></div>
        </div>
    </div>

    <script type="module" src="/static/js/main.js?v=5"></script>
</body>
</html>
